<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starting Biyaf Website...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
        }
        h1 {
            color: #c9a962;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #333;
            border-top-color: #c9a962;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            font-size: 1.1rem;
            margin: 20px 0;
            color: #ccc;
        }
        .success {
            color: #4caf50;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏗️ Biyaf Architecture Studio</h1>
        <div class="spinner"></div>
        <div class="status" id="status">Initializing website data...</div>
    </div>

    <script>
        const statusEl = document.getElementById('status');
        
        // Initialize data
        function initializeData() {
            const defaultData = {
                hero: {
                    eyebrow: 'Biyaf Architecture Studio',
                    title: 'We design buildings that <em>hold their ground</em>.',
                    description: 'Biyaf is a design-led architecture practice shaping residential, commercial and public buildings across Ethiopia — built on precision, material honesty, and a deep read of site and climate.',
                    buttons: [
                        { text: 'View Projects', link: 'projects.html', style: 'solid' },
                        { text: 'Start a Project', link: 'contact.html', style: 'outline' }
                    ],
                    image: 'images/hero-residence.jpeg',
                    imageAlt: 'Luxury modern residence with large windows at dusk, designed by Biyaf',
                    coordinates: 'N 09°02\' E 38°45\'',
                    figureLabel: 'FIG. 01 — RESIDENCE'
                },
                stats: [
                    { number: 14, label: 'Years in Practice', suffix: '' },
                    { number: 86, label: 'Projects Delivered', suffix: '+' },
                    { number: 12, label: 'Cities Built In', suffix: '' },
                    { number: 23, label: 'Team Members', suffix: '' }
                ],
                projects: [
                    { id: 1, title: 'Kebena Residence', description: 'A terraced concrete home stepping down a ridge in Bale Robe.', category: 'residential', year: '2023', projectCode: 'PRJ.014', image: 'images/project-kebena.jpeg' },
                    { id: 2, title: 'Bole Commerce Hub', description: 'Mixed-use tower with a ventilated stone facade and public plaza.', category: 'commercial', year: '2022', projectCode: 'PRJ.021', image: 'images/project-bole.jpeg' },
                    { id: 3, title: 'Entoto Cultural Pavilion', description: 'A timber-framed civic hall referencing traditional roof forms.', category: 'public', year: '2020', projectCode: 'PRJ.009', image: 'images/project-entoto.jpeg' },
                    { id: 4, title: 'Sarbet Courtyard House', description: 'Two volumes wrapped around a shaded internal courtyard.', category: 'residential', year: '2021', projectCode: 'PRJ.011', image: 'images/project-sarbet.jpeg' },
                    { id: 5, title: 'Mercato Office Block', description: 'A stacked-slab office building with deep shading fins.', category: 'commercial', year: '2024', projectCode: 'PRJ.028', image: 'images/project-mercato.jpeg' },
                    { id: 6, title: 'Piassa Public Library', description: 'A single-storey reading hall with a folded timber roof.', category: 'public', year: '2025', projectCode: 'PRJ.033', image: 'images/project-piassa.jpeg' }
                ],
                services: [
                    { id: 1, number: 'A—01', title: 'Architectural Design', description: 'Full concept-to-construction design services — from feasibility studies and concept massing through to detailed construction drawings, for homes, offices, retail and institutional buildings.' },
                    { id: 2, number: 'A—02', title: 'Interior Architecture', description: 'Spatial planning, material palettes, lighting design and custom joinery that carry a building\'s architectural language through to its interior spaces.' },
                    { id: 3, number: 'A—03', title: 'Urban & Masterplanning', description: 'Site strategy, density and massing studies, and full masterplans for mixed-use and multi-phase developments.' },
                    { id: 4, number: 'A—04', title: 'Renovation & Restoration', description: 'Adaptive reuse, structural renewal and sensitive restoration for existing buildings and heritage sites.' },
                    { id: 5, number: 'A—05', title: 'Construction Administration', description: 'On-site oversight through the build phase, coordinating contractors and engineers to keep a project true to its drawings.' }
                ],
                about: {
                    story: {
                        eyebrow: 'Our Story',
                        title: 'Designing with the land, not over it',
                        paragraphs: [
                            'Biyaf was founded by a small group of architects who trained across Ethiopia and abroad, and came home with one question: why did so much new construction ignore the climate, materials and craft already available on site?',
                            'Today the studio works across residential, commercial and public-sector commissions, but the founding question still shapes every project brief — read the site first, then design.'
                        ],
                        image: 'images/about-mansion.jpeg'
                    },
                    values: [
                        { title: 'Site First', description: 'Topography, light and wind studies happen before a single wall is sketched.' },
                        { title: 'Material Honesty', description: 'We build in materials that age well and are sourced close to where they\'re used.' },
                        { title: 'Built to Last', description: 'Structures designed to outlive trends, with maintenance and climate resilience in mind.' }
                    ]
                },
                timeline: [
                    { year: '2012', title: 'Studio Founded', description: 'Biyaf opens as a three-person practice in Bole, taking on its first residential commissions.' },
                    { year: '2016', title: 'First Commercial Tower', description: 'Delivery of a mixed-use building in Bale Robe introduces the studio\'s ventilated-facade approach.' },
                    { year: '2020', title: 'Public Sector Work Begins', description: 'Biyaf is commissioned for its first civic project, a community pavilion referencing traditional roof forms.' },
                    { year: '2026', title: '86+ Projects Delivered', description: 'The studio now works across 12 cities with a team of 23 architects, designers and engineers.' }
                ],
                contact: {
                    address: 'Wako Gutu Adebabay, Bale Robe',
                    city: 'Bale Robe, Ethiopia',
                    phones: ['+251 90 008 5951', '+251 94 929 2418'],
                    email: 'studio@biyaf.et',
                    emailNote: 'Response within 2 business days',
                    hours: 'Mon – Fri',
                    hoursDetail: '8:30 AM – 6:00 PM',
                    social: { instagram: '#', linkedin: '#', telegram: '#' }
                }
            };

            try {
                localStorage.setItem('biyaf_website_data', JSON.stringify(defaultData));
                statusEl.textContent = 'Data initialized successfully!';
                statusEl.className = 'status success';
                console.log('✅ Data initialized');
                
                setTimeout(() => {
                    statusEl.textContent = 'Redirecting to website...';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                }, 1000);
            } catch (error) {
                statusEl.textContent = 'Error: ' + error.message;
                statusEl.style.color = '#f44336';
                console.error('Error initializing data:', error);
            }
        }

        // Check if data exists
        setTimeout(() => {
            const existingData = localStorage.getItem('biyaf_website_data');
            
            if (existingData) {
                statusEl.textContent = 'Data already exists!';
                statusEl.className = 'status success';
                setTimeout(() => {
                    statusEl.textContent = 'Redirecting to website...';
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                }, 1000);
            } else {
                statusEl.textContent = 'Creating website data...';
                setTimeout(initializeData, 800);
            }
        }, 500);
    </script>
</body>
</html>
