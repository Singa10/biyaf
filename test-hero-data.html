<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Data Test</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
      background: #0a0a0a;
      color: #fff;
    }
    h1 { color: #c29e59; }
    .section {
      background: rgba(255,255,255,0.05);
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    pre {
      background: #000;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      border: 1px solid #333;
    }
    button {
      background: #c29e59;
      color: #0a0a0a;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    button:hover {
      opacity: 0.9;
    }
    .status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .status.success { background: #10b981; color: white; }
    .status.error { background: #ef4444; color: white; }
  </style>
</head>
<body>
  <h1>🔍 Hero Data Diagnostic Test</h1>
  
  <div class="section">
    <h2>Current Hero Data in localStorage</h2>
    <button onclick="loadData()">🔄 Refresh Data</button>
    <button onclick="clearData()">🗑️ Clear All Data</button>
    <button onclick="initDefaults()">⚙️ Initialize Defaults</button>
    <div id="data-display"></div>
  </div>

  <div class="section">
    <h2>Test Hero Update</h2>
    <p>This will update the hero title and save to localStorage:</p>
    <button onclick="testUpdate()">🧪 Test Update Hero Title</button>
    <div id="test-result"></div>
  </div>

  <div class="section">
    <h2>Storage Status</h2>
    <div id="storage-status"></div>
  </div>

  <script>
    function loadData() {
      const data = localStorage.getItem('biyaf_website_data');
      const display = document.getElementById('data-display');
      
      if (data) {
        try {
          const parsed = JSON.parse(data);
          display.innerHTML = `
            <p><span class="status success">✓ Data Found</span></p>
            <pre>${JSON.stringify(parsed, null, 2)}</pre>
          `;
        } catch (error) {
          display.innerHTML = `
            <p><span class="status error">✗ Parse Error</span></p>
            <pre>${error.message}</pre>
          `;
        }
      } else {
        display.innerHTML = `<p><span class="status error">✗ No Data</span> localStorage is empty</p>`;
      }
    }

    function clearData() {
      if (confirm('Clear all data from localStorage?')) {
        localStorage.removeItem('biyaf_website_data');
        localStorage.removeItem('biyaf_uploaded_images');
        alert('✅ Data cleared!');
        loadData();
        checkStorage();
      }
    }

    function initDefaults() {
      const defaultData = {
        hero: {
          eyebrow: 'Biyaf Architecture Studio',
          title: 'We design buildings that <em>hold their ground</em>.',
          description: 'Biyaf is a design-led architecture practice shaping residential, commercial and public buildings across Ethiopia — built on precision, material honesty, and a deep read of site and climate.',
          image: 'images/hero-residence.jpeg',
          imageAlt: 'Luxury modern residence with large windows at dusk, designed by Biyaf',
          coordinates: 'N 09°02\' E 38°45\'',
          figureLabel: 'FIG. 01 — RESIDENCE'
        },
        stats: [
          { number: 14, label: 'Years in Practice', suffix: '' },
          { number: 86, label: 'Projects Delivered', suffix: '+' },
          { number: 12, label: 'Cities Built In', suffix: '' },
          { number: 23, label: 'Team Members', suffix: '' }
        ]
      };
      
      localStorage.setItem('biyaf_website_data', JSON.stringify(defaultData));
      alert('✅ Default data initialized!');
      loadData();
      checkStorage();
    }

    function testUpdate() {
      const data = localStorage.getItem('biyaf_website_data');
      const result = document.getElementById('test-result');
      
      if (!data) {
        result.innerHTML = '<p><span class="status error">✗ No data to update</span> Initialize defaults first</p>';
        return;
      }
      
      try {
        const parsed = JSON.parse(data);
        const timestamp = new Date().toLocaleTimeString();
        
        // Update hero title
        parsed.hero.title = `TEST UPDATE at ${timestamp}`;
        
        // Save back
        localStorage.setItem('biyaf_website_data', JSON.stringify(parsed));
        
        result.innerHTML = `
          <p><span class="status success">✓ Update Successful</span></p>
          <p>Hero title updated to: <strong>${parsed.hero.title}</strong></p>
          <p>Refresh the homepage to see the change!</p>
        `;
        
        loadData();
      } catch (error) {
        result.innerHTML = `
          <p><span class="status error">✗ Update Failed</span></p>
          <pre>${error.message}</pre>
        `;
      }
    }

    function checkStorage() {
      const status = document.getElementById('storage-status');
      const data = localStorage.getItem('biyaf_website_data');
      const images = localStorage.getItem('biyaf_uploaded_images');
      
      let totalSize = 0;
      if (data) totalSize += new Blob([data]).size;
      if (images) totalSize += new Blob([images]).size;
      
      const totalSizeKB = (totalSize / 1024).toFixed(2);
      const limitMB = 5; // Typical localStorage limit
      const usedPercent = ((totalSize / (limitMB * 1024 * 1024)) * 100).toFixed(2);
      
      status.innerHTML = `
        <p><strong>Total Storage Used:</strong> ${totalSizeKB} KB (~${usedPercent}% of ~${limitMB}MB limit)</p>
        <p><strong>biyaf_website_data:</strong> ${data ? 'Present' : 'Missing'} ${data ? '(' + (new Blob([data]).size / 1024).toFixed(2) + ' KB)' : ''}</p>
        <p><strong>biyaf_uploaded_images:</strong> ${images ? 'Present' : 'Missing'} ${images ? '(' + (new Blob([images]).size / 1024).toFixed(2) + ' KB)' : ''}</p>
      `;
    }

    // Load on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      checkStorage();
    });
  </script>
</body>
</html>
