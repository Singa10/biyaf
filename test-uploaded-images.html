<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uploaded Images Test</title>
  <style>
    body {
      font-family: system-ui;
      max-width: 1000px;
      margin: 2rem auto;
      padding: 2rem;
      background: #0a0a0a;
      color: #fff;
    }
    .box {
      background: rgba(255,255,255,0.05);
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255,255,255,0.1);
    }
    button {
      background: #c29e59;
      color: #0a0a0a;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-right: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1rem;
    }
    .image-card {
      background: rgba(255,255,255,0.03);
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .image-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 0.5rem;
    }
    .image-info {
      font-size: 0.85rem;
      color: #aaa;
    }
    pre {
      background: #000;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>📦 Uploaded Images from localStorage</h1>
  
  <div class="box">
    <h2>Uploaded Images</h2>
    <button onclick="loadImages()">🔄 Reload Images</button>
    <div id="images-container"></div>
  </div>

  <div class="box">
    <h2>Test: Set Uploaded Image as Hero</h2>
    <p>Select an uploaded image to use as hero:</p>
    <div id="select-container"></div>
    <div id="test-result" style="margin-top: 1rem;"></div>
  </div>

  <div class="box">
    <h2>Current Hero Image Settings</h2>
    <button onclick="checkHeroSettings()">🔍 Check Hero Data</button>
    <pre id="hero-data"></pre>
  </div>

  <script>
    function loadImages() {
      const container = document.getElementById('images-container');
      const selectContainer = document.getElementById('select-container');
      
      try {
        const uploadedImages = localStorage.getItem('biyaf_uploaded_images');
        
        if (!uploadedImages) {
          container.innerHTML = '<p class="error">❌ No uploaded images found in localStorage</p>';
          return;
        }
        
        const images = JSON.parse(uploadedImages);
        
        if (images.length === 0) {
          container.innerHTML = '<p class="error">❌ No images uploaded yet</p>';
          return;
        }
        
        container.innerHTML = `<p class="success">✅ Found ${images.length} uploaded image(s)</p>`;
        
        const grid = document.createElement('div');
        grid.className = 'image-grid';
        
        images.forEach((img, index) => {
          const card = document.createElement('div');
          card.className = 'image-card';
          
          const hasData = img.dataUrl && img.dataUrl.length > 0;
          
          card.innerHTML = `
            ${hasData ? `<img src="${img.dataUrl}" alt="${img.filename}">` : '<p class="error">No image data</p>'}
            <div class="image-info">
              <strong>${img.filename}</strong><br>
              Path: ${img.path}<br>
              ${hasData ? `Size: ${(img.dataUrl.length / 1024).toFixed(2)} KB` : 'Missing data!'}
            </div>
          `;
          
          grid.appendChild(card);
        });
        
        container.appendChild(grid);
        
        // Create selection buttons
        selectContainer.innerHTML = images.map((img, index) => 
          `<button onclick="setAsHero('${img.path}', '${img.filename}')">${img.filename}</button>`
        ).join('');
        
      } catch (error) {
        container.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
      }
    }

    function setAsHero(path, filename) {
      const resultDiv = document.getElementById('test-result');
      
      try {
        const data = localStorage.getItem('biyaf_website_data');
        if (!data) {
          resultDiv.innerHTML = '<p class="error">❌ No website data found. Initialize from admin first.</p>';
          return;
        }
        
        const parsed = JSON.parse(data);
        parsed.hero.image = path;
        
        localStorage.setItem('biyaf_website_data', JSON.stringify(parsed));
        
        resultDiv.innerHTML = `
          <p class="success">✅ Hero image set to: ${filename}</p>
          <p>Path: ${path}</p>
          <p><strong>Now refresh the homepage to see it!</strong></p>
          <a href="/" target="_blank" style="display: inline-block; background: #c29e59; color: #0a0a0a; padding: 0.75rem 1.5rem; border-radius: 6px; text-decoration: none; font-weight: 600; margin-top: 0.5rem;">
            🌐 Open Homepage
          </a>
        `;
        
      } catch (error) {
        resultDiv.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
      }
    }

    function checkHeroSettings() {
      const heroData = document.getElementById('hero-data');
      
      try {
        const data = localStorage.getItem('biyaf_website_data');
        if (!data) {
          heroData.textContent = 'No data found';
          return;
        }
        
        const parsed = JSON.parse(data);
        heroData.textContent = JSON.stringify(parsed.hero, null, 2);
        
      } catch (error) {
        heroData.textContent = `Error: ${error.message}`;
      }
    }

    // Auto-load on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadImages();
      checkHeroSettings();
    });
  </script>
</body>
</html>
