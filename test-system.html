<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biyaf System Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            color: #c9a962;
            margin-bottom: 20px;
            text-align: center;
            font-size: 2rem;
        }
        .test-section {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .test-section h2 {
            color: #c9a962;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        .test-result {
            padding: 10px;
            margin: 8px 0;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .test-result.pass {
            background: #004400;
            border-left: 4px solid #00ff00;
        }
        .test-result.fail {
            background: #440000;
            border-left: 4px solid #ff0000;
            color: #ff6666;
        }
        .test-result.info {
            background: #002244;
            border-left: 4px solid #4499ff;
            color: #66ccff;
        }
        .icon {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .btn {
            background: #c9a962;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background: #d4b576;
        }
        .btn.secondary {
            background: #333;
            color: #fff;
        }
        .btn.secondary:hover {
            background: #444;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        .data-preview {
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            margin-top: 10px;
            max-height: 300px;
            overflow-y: auto;
        }
        .data-preview pre {
            color: #00ff00;
            font-size: 0.85rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .stat-card {
            background: #222;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            color: #c9a962;
            font-weight: bold;
        }
        .stat-label {
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Biyaf System Test Dashboard</h1>
        
        <div class="test-section">
            <h2>System Status</h2>
            <div id="system-status"></div>
        </div>

        <div class="test-section">
            <h2>Data Integrity Check</h2>
            <div id="data-check"></div>
        </div>

        <div class="test-section">
            <h2>Quick Actions</h2>
            <div class="actions">
                <button class="btn" onclick="runAllTests()">🔄 Run All Tests</button>
                <button class="btn" onclick="initializeData()">📦 Initialize Data</button>
                <button class="btn" onclick="viewData()">👁️ View Data</button>
                <button class="btn secondary" onclick="clearData()">🗑️ Clear Data</button>
                <button class="btn secondary" onclick="location.href='index.html'">🏠 Frontend</button>
                <button class="btn secondary" onclick="location.href='admin/login.html'">🔐 Admin</button>
            </div>
        </div>

        <div class="test-section">
            <h2>Data Preview</h2>
            <div id="data-preview"></div>
        </div>

        <div class="test-section">
            <h2>Console Output</h2>
            <div class="data-preview">
                <pre id="console-output">Waiting for test results...</pre>
            </div>
        </div>
    </div>

    <script>
        let consoleLog = [];

        // Override console.log to capture output
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            consoleLog.push(args.join(' '));
            updateConsoleOutput();
        };

        function updateConsoleOutput() {
            const output = document.getElementById('console-output');
            output.textContent = consoleLog.slice(-20).join('\n');
        }

        function addTestResult(container, status, message) {
            const div = document.createElement('div');
            div.className = `test-result ${status}`;
            const icon = status === 'pass' ? '✓' : status === 'fail' ? '✗' : 'ℹ';
            div.innerHTML = `<span class="icon">${icon}</span><span>${message}</span>`;
            container.appendChild(div);
        }

        function runAllTests() {
            console.log('=== Starting System Tests ===');
            consoleLog = ['=== Starting System Tests ==='];
            
            // Test 1: LocalStorage availability
            const systemStatus = document.getElementById('system-status');
            systemStatus.innerHTML = '';
            
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                addTestResult(systemStatus, 'pass', 'LocalStorage is available');
                console.log('✓ LocalStorage available');
            } catch (e) {
                addTestResult(systemStatus, 'fail', 'LocalStorage not available: ' + e.message);
                console.log('✗ LocalStorage not available:', e);
            }

            // Test 2: Check if data exists
            const dataExists = localStorage.getItem('biyaf_website_data');
            if (dataExists) {
                addTestResult(systemStatus, 'pass', 'Data exists in localStorage');
                console.log('✓ Data exists');
            } else {
                addTestResult(systemStatus, 'fail', 'No data found in localStorage');
                console.log('✗ No data found');
            }

            // Test 3: Data integrity
            const dataCheck = document.getElementById('data-check');
            dataCheck.innerHTML = '';
            
            if (dataExists) {
                try {
                    const data = JSON.parse(dataExists);
                    addTestResult(dataCheck, 'pass', 'Data is valid JSON');
                    console.log('✓ Data is valid JSON');

                    const sections = ['hero', 'stats', 'projects', 'services', 'about', 'timeline', 'contact'];
                    sections.forEach(section => {
                        if (data[section]) {
                            let detail = '';
                            if (Array.isArray(data[section])) {
                                detail = ` (${data[section].length} items)`;
                            }
                            addTestResult(dataCheck, 'pass', `${section}${detail}`);
                            console.log(`✓ ${section}${detail}`);
                        } else {
                            addTestResult(dataCheck, 'fail', `Missing ${section}`);
                            console.log(`✗ Missing ${section}`);
                        }
                    });

                    // Show summary stats
                    const summary = document.createElement('div');
                    summary.className = 'stats-grid';
                    summary.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-number">${data.stats?.length || 0}</div>
                            <div class="stat-label">Statistics</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${data.projects?.length || 0}</div>
                            <div class="stat-label">Projects</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${data.services?.length || 0}</div>
                            <div class="stat-label">Services</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${data.timeline?.length || 0}</div>
                            <div class="stat-label">Timeline Events</div>
                        </div>
                    `;
                    dataCheck.appendChild(summary);

                } catch (e) {
                    addTestResult(dataCheck, 'fail', 'Data parse error: ' + e.message);
                    console.log('✗ Parse error:', e);
                }
            } else {
                addTestResult(dataCheck, 'info', 'No data to check. Click "Initialize Data" to create it.');
                console.log('ℹ No data to check');
            }

            console.log('=== Tests Complete ===');
        }

        function initializeData() {
            const defaultData = {

                },

                ],

                    { id: 2, title: 'Bole Commerce Hub', description: 'Mixed-use tower with a ventilated stone facade and public plaza.', category: 'commercial', year: '2022', projectCode: 'PRJ.021', image: 'images/project-bole.jpeg' },
                    { id: 3, title: 'Entoto Cultural Pavilion', description: 'A timber-framed civic hall referencing traditional roof forms.', category: 'public', year: '2020', projectCode: 'PRJ.009', image: 'images/project-entoto.jpeg' },

                    { id: 6, title: 'Piassa Public Library', description: 'A single-storey reading hall with a folded timber roof.', category: 'public', year: '2025', projectCode: 'PRJ.033', image: 'images/project-piassa.jpeg' }
                ],

                    { id: 1, number: 'A—01', title: 'Architectural Design', description: 'Full concept-to-construction design services — from feasibility studies and concept massing through to detailed construction drawings, for homes, offices, retail and institutional buildings.' },

                ],

                            'Biyaf was founded by a small group of architects who trained across Ethiopia and abroad, and came home with one question: why did so much new construction ignore the climate, materials and craft already available on site?',
                            'Today the studio works across residential, commercial and public-sector commissions, but the founding question still shapes every project brief — read the site first, then design.'
                        ],
                        image: 'images/about-mansion.jpeg'
                    },
                    values: [
                        { title: 'Site First', description: 'Topography, light and wind studies happen before a single wall is sketched.' },
                        { title: 'Material Honesty', description: 'We build in materials that age well and are sourced close to where they\'re used.' },
                        { title: 'Built to Last', description: 'Structures designed to outlive trends, with maintenance and climate resilience in mind.' }
                    ]
                },
                timeline: [
                    { year: '2012', title: 'Studio Founded', description: 'Biyaf opens as a three-person practice in Bole, taking on its first residential commissions.' },
                    { year: '2016', title: 'First Commercial Tower', description: 'Delivery of a mixed-use building in Bale Robe introduces the studio\'s ventilated-facade approach.' },
                    { year: '2020', title: 'Public Sector Work Begins', description: 'Biyaf is commissioned for its first civic project, a community pavilion referencing traditional roof forms.' },
                    { year: '2026', title: '86+ Projects Delivered', description: 'The studio now works across 12 cities with a team of 23 architects, designers and engineers.' }
                ],
                contact: {
                    address: 'Wako Gutu Adebabay, Bale Robe',
                    city: 'Bale Robe, Ethiopia',
                    phones: ['+251 90 008 5951', '+251 94 929 2418'],
                    email: 'studio@biyaf.et',
                    emailNote: 'Response within 2 business days',
                    hours: 'Mon – Fri',
                    hoursDetail: '8:30 AM – 6:00 PM',
                    social: { instagram: '#', linkedin: '#', telegram: '#' }
                }
            };

            localStorage.setItem('biyaf_website_data', JSON.stringify(defaultData));
            console.log('✓ Data initialized successfully');
            alert('✅ Mock data initialized successfully!\n\nYou can now:\n• View Frontend (index.html)\n• Login to Admin (admin/login.html)\n  Username: admin\n  Password: biyaf2024');
            runAllTests();
        }

        function viewData() {
            const preview = document.getElementById('data-preview');
            const data = localStorage.getItem('biyaf_website_data');
            
            if (data) {
                const parsed = JSON.parse(data);
                preview.innerHTML = '<div class="data-preview"><pre>' + JSON.stringify(parsed, null, 2) + '</pre></div>';
                console.log('Data displayed');
            } else {
                preview.innerHTML = '<div class="test-result fail"><span class="icon">✗</span><span>No data found</span></div>';
                console.log('No data to display');
            }
        }

        function clearData() {
            if (confirm('Are you sure you want to clear all data?')) {
                localStorage.removeItem('biyaf_website_data');
                console.log('Data cleared');
                alert('🗑️ Data cleared successfully');
                runAllTests();
            }
        }

        // Run tests on page load
        window.addEventListener('load', () => {
            console.log('Test dashboard loaded');
            runAllTests();
        });
    </script>
</body>
</html>
