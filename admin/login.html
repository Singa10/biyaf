<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Biyaf Architecture Studio</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="css/admin.css">
<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body>

<div class="login-container">
  <div class="login-box">
    <div class="login-header">
      <div class="login-logo">BIY<span>AF</span></div>
      <h2>Admin Dashboard</h2>
      <p>Sign in to manage your website content</p>
    </div>

    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="username"><i class="ri-user-line"></i> Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>

      <div class="form-group">
        <label for="password"><i class="ri-lock-line"></i> Password</label>
        <div class="password-input">
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
          <button type="button" class="toggle-password" id="toggle-password">
            <i class="ri-eye-line"></i>
          </button>
        </div>
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="remember" name="remember">
          <span>Remember me</span>
        </label>
      </div>

      <button type="submit" class="btn btn-solid login-btn">
        <i class="ri-login-box-line"></i> Sign In
      </button>

      <div class="login-info">
        <i class="ri-information-line"></i>
        <p><strong>Demo Credentials:</strong> admin / admin123</p>
      </div>
    </form>
  </div>

  <div class="login-bg">
    <div class="blueprint-bg"></div>
  </div>
</div>

<script src="js/admin-auth.js"></script>
</body>
</html>
